[phases.setup]
# openssl: required by Prisma linux-musl-openssl-3.0.x engine at runtime
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
# Generate Prisma client with the correct engine binary for Alpine/Linux
cmds = ["npx prisma generate"]

[start]
# Automatically sync schema with PostgreSQL database on startup before launching application
cmd = "npx prisma db push --accept-data-loss && node src/server.js"
